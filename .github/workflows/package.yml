name: Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber
      - uses: oras-project/setup-oras@v1
      - name: Push OCI artifact to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}"
          echo "${GITHUB_TOKEN}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          oras push "$image" \
            --artifact-type application/vnd.rapidocr-worker.release.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.title=rapidocr-worker ${TAG}" \
            --annotation "org.opencontainers.image.description=Standalone ONNX Runtime OCR worker (PP-OCR) over UNIX domain sockets" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0" \
            dist/*.tar.gz:application/gzip \
            dist/SHA256SUMS:text/plain
          oras tag "$image" latest
